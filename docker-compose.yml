services:
  # PostgreSQL Database
  database:
    image: postgres:15-alpine
    container_name: whispey-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin123}
      POSTGRES_DB: ${DB_NAME:-agent_evals}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./setup-db.sql:/docker-entrypoint-initdb.d/01-setup-db.sql:ro
      - ./migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-agent_evals}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whispey

  # Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    image: whispey-frontend:latest
    container_name: whispey-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DEBUG=true
      - POSTGRES_HOST=database
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=${DB_NAME:-agent_evals}
      - POSTGRES_USER=${DB_USER:-admin}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-admin123}
      - POSTGRES_SSL=false
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3005/api/}
      - JWT_SECRET=${JWT_SECRET:-2c2c2e1e5e1491abe5d7e11233a047edf017e509b7b7bca236288e127df85711}
      - WHISPEY_MASTER_KEY=${WHISPEY_MASTER_KEY:-change-this-master-key}
      - VAPI_MASTER_KEY=${VAPI_MASTER_KEY:-change-this-vapi-key}
      - PYTHON_BACKEND_URL=http://gateway:8010
    ports:
      - "${APP_PORT:-3005}:3000"
    volumes:
      - audios:/app/audios
    depends_on:
      database:
        condition: service_healthy
      gateway:
        condition: service_healthy
    networks:
      - whispey
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Gateway - FastAPI with Diarization & Language ID
  gateway:
    build:
      context: ./python-backend
      dockerfile: Dockerfile
    image: whispey-gateway:latest
    container_name: whispey-gateway
    restart: unless-stopped
    environment:
      - PORT=8010
      - VLLM_ASR_BASE_URL=http://asr-vllm:8002/v1
      - VLLM_ASR_API_KEY=token-abc123
      - VLLM_TRANSLATE_BASE_URL=http://translate-vllm:8005/v1
      - VLLM_TRANSLATE_API_KEY=token-abc123
      - VLLM_TRANSLATE_MODEL=google/gemma-3-4b-it
      - TARGET_LANGUAGE=${TARGET_LANGUAGE:-English}
      - TRANSCRIPTION_PROMPT=${TRANSCRIPTION_PROMPT:-can you transcribe the speech into a written format?}
      - HF_TOKEN=${HF_TOKEN}
    ports:
      - "${PYTHON_BACKEND_PORT:-8010}:8010"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ~/.cache/speechbrain:/app/tmp
    depends_on:
      - asr-vllm
      - translate-vllm
    networks:
      - whispey
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8010/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ASR vLLM Server
  asr-vllm:
    build:
      context: ./python-backend
      dockerfile: Dockerfile.ASR
    image: whispey-asr-vllm:latest
    container_name: whispey-asr-vllm
    restart: unless-stopped
    command: >
      --model ibm-granite/granite-speech-4.1-2b
      --port 8002
      --max-model-len 2048
      --max-num-seqs 256
      -tp 1
    ports:
      - "8002:8002"
    environment:
      - VLLM_CPU_OMP_THREADS_BIND=128-159
      - OMP_NUM_THREADS=32
      - VLLM_CPU_SGL_KERNEL=0
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    networks:
      - whispey
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Translation vLLM Server
  translate-vllm:
    image: vllm/vllm-openai-cpu:v0.19.0
    container_name: whispey-translate-vllm
    restart: unless-stopped
    command: >
      --model google/gemma-3-4b-it
      --port 8005
      --max-model-len 2048
      --max-num-seqs 128
      -tp 1
    ports:
      - "8005:8005"
    environment:
      - VLLM_CPU_OMP_THREADS_BIND=160-191
      - OMP_NUM_THREADS=32
      - VLLM_CPU_SGL_KERNEL=1
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    networks:
      - whispey
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8005/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  audios:
    driver: local

networks:
  whispey:
    driver: bridge
